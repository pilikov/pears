<!-- Optional static template (if you don't want JS to generate DOM) -->
<section class="altai-sticky-wrapper" id="altaiStickyBlock">
  <div class="altai-sticky-scene">
    <video
      class="altai-sticky-bg"
      src="https://storage.yandexcloud.net/pears/river.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>
    <div class="altai-sticky-fade"></div>

    <div class="altai-sticky-title">
      <p class="altai-sticky-kicker tune-smallcaps-lead">алтай</p>
      <h2 class="altai-sticky-heading altai-sticky-reveal-title">Место силы<br>и вдохновения</h2>
    </div>

    <article class="altai-sticky-card">
      <img class="altai-sticky-card-image" alt="">
      <p class="altai-sticky-card-text"></p>
    </article>

    <div class="altai-sticky-dots"></div>
  </div>
</section>
